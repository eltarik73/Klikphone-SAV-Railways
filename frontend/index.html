<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- v2.3.0 - marketing module + avis google + community manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlikPhone SAV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Barre du navigateur : blanche sur téléphone (menu à fond blanc), sombre au-dessus de 1 024 px -->
    <meta name="theme-color" content="#FFFFFF" media="(max-width: 1023px)" />
    <meta name="theme-color" content="#0F172A" media="(min-width: 1024px)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KlikPhone" />
    <!-- v3 icons (2026-11-08) : le « K » officiel KlikPhone (orange #FF6600, gris, tournevis blanc),
         tiré du PDF vectoriel fourni par le gérant ; remplace le K violet de la v2 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <meta name="description" content="Klikphone SAV - Suivi de réparation smartphone, tablette et PC à Chambéry. Déposez votre appareil ou suivez votre réparation en ligne." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Une seule police : Inter variable (graisses 400-700, axe de taille optique 14-32 : « Display » automatique
         sur les titres via font-optical-sizing). Décision du gérant, 8 nov. 2026 ; plus de serif d'accent.
         Préchargée puis appliquée sans bloquer le rendu, display=swap. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <!-- Écran de chargement affiché dès le HTML : sans lui, l'écran reste vide tant que
           le JS n'est pas téléchargé (plusieurs secondes quand le serveur est chargé).
           React remplace ce contenu au premier rendu. -->
      <div id="kp-boot" role="status" aria-live="polite">
        <style>
          #kp-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#64748b}
          #kp-boot .kp-mark{width:56px;height:56px;display:block}
          #kp-boot .kp-spin{width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:#0F172A;border-radius:50%;animation:kp-spin .8s linear infinite}
          #kp-boot .kp-slow{display:none;text-align:center;max-width:280px;font-size:14px;line-height:1.4}
          #kp-boot.kp-is-slow .kp-slow{display:block}
          #kp-boot button{margin-top:12px;min-height:44px;padding:10px 20px;border:0;border-radius:6px;background:#0F172A;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
          #kp-boot button:focus-visible{outline:3px solid #475569;outline-offset:2px}
          @keyframes kp-spin{to{transform:rotate(360deg)}}
          @media (prefers-reduced-motion:reduce){#kp-boot .kp-spin{animation-duration:2.4s}}
        </style>

        <div class="kp-spin" aria-hidden="true"></div>
        <p style="margin:0;font-size:14px;font-weight:600">Chargement…</p>
        <div class="kp-slow">
          Le chargement prend plus de temps que prévu.
          <br /><button type="button" onclick="location.reload()">Recharger</button>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var b = document.getElementById('kp-boot');
        if (b) b.className = 'kp-is-slow';
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
